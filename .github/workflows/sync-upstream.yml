name: Sync upstream decolua/9router

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    name: Merge upstream into master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "marvrouter-bot"
          git config user.email "marvrouter-bot@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/decolua/9router.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Merge upstream/master
        id: sync
        run: bash scripts/sync-upstream.sh

      - name: Push merge to master
        if: steps.sync.outputs.status == 'merged'
        run: git push origin HEAD:master

      # A push made with GITHUB_TOKEN never triggers other workflows, so the release
      # build is dispatched explicitly, and only when upstream actually shipped a new version.
      - name: Build release for the new version
        if: steps.sync.outputs.status == 'merged' && steps.sync.outputs.version_changed == 'true'
        run: gh workflow run build-release.yml --ref master

      - name: Close sync issues after recovery
        if: success()
        run: |
          gh issue list --label upstream-sync --state open --json number --jq '.[].number' | while read -r number; do
            gh issue close "$number" --comment "Sync recovered: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

      - name: Report sync failure
        if: failure()
        env:
          REASON: ${{ steps.sync.outputs.reason }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="Upstream sync failed: ${REASON:-see the run log}

          Run: ${RUN_URL}

          No changes were pushed, so master is still on its last good commit. Fix the cause, then run the Sync upstream workflow again. Later failures stay quiet while this issue is open, and it closes itself once a sync succeeds."
          {
            echo "## Upstream sync failed"
            echo
            echo "${REASON:-see the run log}"
            echo
            echo "Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --label upstream-sync --title "Upstream sync is failing" --body "$BODY"
          fi
