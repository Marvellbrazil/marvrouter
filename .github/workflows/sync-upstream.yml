name: Sync upstream decolua/9router

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Merge upstream into master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "marvrouter-bot"
          git config user.email "marvrouter-bot@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/decolua/9router.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."

      # Fork-owned styling: keep OUR versions of the UI customizations so an upstream
      # change to the dashboard can never silently bring the donate button back or
      # strip the OverviewCards details. Listed files are checked out from OUR side
      # (HEAD) after the merge, overriding whatever upstream brought in.
      - name: Merge upstream/master
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git merge --no-edit --no-commit upstream/master || true
          git checkout --ours \
            src/app/globals.css \
            "src/app/(dashboard)/dashboard/usage/components/OverviewCards.js" \
            src/shared/components/Header.js \
            2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "conflict=none" >> "$GITHUB_OUTPUT"
            git commit -m "chore: merge upstream decolua/9router ($(git rev-parse --short upstream/master))"
          else
            git commit -m "chore: merge upstream decolua/9router ($(git rev-parse --short upstream/master))"
          fi

      - name: Guard fork styling survived the merge
        if: steps.check.outputs.behind != '0'
        run: |
          set -e
          FAILED=0
          CSS=$(grep -c 'aria-label.*Donate.*display.*none' src/app/globals.css || true)
          if [ "$CSS" -lt 1 ]; then
            echo "::error::donate-hide rule missing from globals.css after merge"
            FAILED=1
          fi
          grep -qi 'idr' "src/app/(dashboard)/dashboard/usage/components/OverviewCards.js" || { echo "::error::IDR detail missing from OverviewCards.js after merge"; FAILED=1; }
          grep -q 'Estimated, not actual billing' "src/app/(dashboard)/dashboard/usage/components/OverviewCards.js" && { echo "::error::EST. COST disclaimer re-appeared in OverviewCards.js"; FAILED=1; } || true
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Fork styling intact."

      - name: Push merge to master
        if: steps.check.outputs.behind != '0'
        run: git push origin master

      - name: Report sync failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-sync",
            });
            const title = `Upstream sync issue at ${new Date().toISOString()}`;
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["upstream-sync"],
                body: "Automatic merge of `decolua/9router:master` into `master` failed or fork styling guard tripped. Check the Actions log; resolve locally and push.",
              });
            }
