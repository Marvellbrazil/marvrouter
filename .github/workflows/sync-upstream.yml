name: Sync upstream decolua/9router

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Merge upstream into master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "marvrouter-bot"
          git config user.email "marvrouter-bot@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/decolua/9router.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."

      - name: Merge upstream/master
        if: steps.check.outputs.behind != '0'
        run: git merge --no-edit upstream/master

      - name: Push merge to master
        if: steps.check.outputs.behind != '0'
        run: git push origin master

      - name: Report merge conflict
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-sync",
            });
            const title = `Upstream sync conflict at ${new Date().toISOString()}`;
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["upstream-sync"],
                body: "Automatic merge of `decolua/9router:master` into `master` failed. Resolve locally and push.",
              });
            }
