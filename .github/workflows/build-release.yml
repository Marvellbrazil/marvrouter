name: Build marvrouter release

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/dependabot.yml"
      - ".github/issue-assets/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the fork-releases GitHub Release"
        required: false
        default: true
        type: boolean

concurrency:
  group: marvrouter-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build app + gateways (linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix cli --no-audit --no-fund

      - name: Build CLI app (Next.js standalone bundle)
        run: node cli/scripts/build-cli.js

      - name: Build gateway (linux/arm64)
        working-directory: gateway
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ../dist/9router-gateway .

      - name: Build front proxy (linux/arm64)
        working-directory: front
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ../dist/marvrouter-front .

      - name: Pack artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_SHA=$(git rev-parse --short HEAD)
          mkdir -p dist/app
          tar -czf "dist/marvrouter-app-$VERSION.tar.gz" -C cli app
          tar -czf dist/marvrouter-front.tar.gz -C dist marvrouter-front
          tar -czf dist/marvrouter-gateway.tar.gz -C dist 9router-gateway
          {
            echo "MARV_VERSION=$VERSION"
            echo "BUILD_SHA=$BUILD_SHA"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          echo "$VERSION" > dist/version.txt
          # build metadata the server updater uses for per-commit deploys
          printf '%s\n' "$BUILD_SHA" > dist/build-info.txt
          { echo "sha=$BUILD_SHA"; echo "full_sha=$(git rev-parse HEAD)"; echo "version=$VERSION"; echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> dist/build-info.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: marvrouter-${{ env.MARV_VERSION }}
          path: |
            dist/*.tar.gz
            dist/version.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: fork-v${{ env.MARV_VERSION }}
          name: fork-v${{ env.MARV_VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/version.txt
            dist/build-info.txt
